name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Type check
        run: bun run typecheck

      - name: Verify publish wire fixtures
        run: bun run verify:publish-wire

      - name: Verify wallet balance fixtures
        run: bun run verify:wallet-balance

      - name: Verify immutable waitlist edge contract revision
        run: >-
          echo
          "b5d1a8278cb967c6caacde863d764abae5eaae053870084b0ac1659a7fd71674  contract/waitlist-edge/v1/fixture.json"
          | sha256sum --check

      - name: Verify Marketplace web asset revision
        run: sha256sum --check web/assets.sha256

      - name: Test process boundaries
        run: |
          while IFS= read -r -d '' test_file; do
            bun test "$test_file"
          done < <(find test/bun -type f -name '*process.test.ts' -print0)

      - name: Test remaining suite
        run: >-
          find test/bun -type f \( -name '*.test.ts' -o -name '*.test.js' \)
          ! -name '*process.test.ts'
          -print0
          | xargs -0 bun test

      - name: Build
        run: bun run build:collector

      - name: Installer regression
        run: bash test/installers.test.sh

      - name: Release workflow regression
        run: bash test/release-workflow.test.sh

      - name: Promotion workflow regression
        run: bash test/promotion-workflow.test.sh
