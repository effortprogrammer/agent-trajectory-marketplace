name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify CLI and registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Release package dry run
        run: bun run release:check

  hosted-registry-smoke:
    name: Hosted registry staging smoke
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && vars.HOSTED_REGISTRY_E2E_ENABLED == 'true' }}

    env:
      HOSTED_REGISTRY_E2E_ENABLED: ${{ vars.HOSTED_REGISTRY_E2E_ENABLED }}
      HOSTED_REGISTRY_URL: ${{ secrets.HOSTED_REGISTRY_URL }}
      HOSTED_REGISTRY_API_KEY: ${{ secrets.HOSTED_REGISTRY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate hosted staging secrets
        run: bun scripts/hosted-registry-e2e.ts --validate-env

      - name: Run hosted registry staging smoke
        run: |
          mkdir -p .omo/evidence/marketplace-prelaunch-roadmap
          bun scripts/hosted-registry-e2e.ts --summary .omo/evidence/marketplace-prelaunch-roadmap/task-11-hosted-e2e-summary.json

      - name: Upload hosted smoke summary
        uses: actions/upload-artifact@v4
        with:
          name: hosted-registry-e2e-summary
          path: .omo/evidence/marketplace-prelaunch-roadmap/task-11-hosted-e2e-summary.json
