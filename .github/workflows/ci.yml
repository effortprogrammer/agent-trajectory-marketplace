name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout companion registry
        uses: actions/checkout@v4
        with:
          repository: effortprogrammer/agent-trajectory-registry
          ref: 37184ac46031f4a0c7827c78a0116a8ffa837fc4
          path: agent-trajectory-registry

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install companion registry
        run: uv sync --all-groups --project agent-trajectory-registry

      - name: Type check
        run: bun run typecheck

      - name: Verify publish wire fixtures
        run: bun run verify:publish-wire

      - name: Verify wallet balance fixtures
        run: bun run verify:wallet-balance

      - name: Test
        run: bun test test/bun
        env:
          TRAJECTORY_REGISTRY_ROOT: ${{ github.workspace }}/agent-trajectory-registry

      - name: Build
        run: bun run build:collector

      - name: Installer regression
        run: bash test/installers.test.sh

      - name: Release workflow regression
        run: bash test/release-workflow.test.sh
