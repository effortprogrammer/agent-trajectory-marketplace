name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Type check
        run: bun run typecheck

      - name: Verify publish wire fixtures
        run: bun run verify:publish-wire

      - name: Verify wallet balance fixtures
        run: bun run verify:wallet-balance

      - name: Test process boundaries
        run: |
          while IFS= read -r -d '' test_file; do
            bun test "$test_file"
          done < <(find test/bun -type f -name '*process.test.ts' -print0)

      - name: Test remaining suite
        run: >-
          find test/bun -type f -name '*.test.ts'
          ! -name '*process.test.ts'
          -print0
          | xargs -0 bun test

      - name: Build
        run: bun run build:collector

      - name: Installer regression
        run: bash test/installers.test.sh

      - name: Release workflow regression
        run: bash test/release-workflow.test.sh
