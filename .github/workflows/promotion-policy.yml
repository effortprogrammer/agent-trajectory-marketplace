name: Promotion policy

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions: {}

jobs:
  promotion-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce integration branches
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const base = context.payload.pull_request.base.ref;
            const head = context.payload.pull_request.head.ref;

            if (base === "main" && !(head === "dev" || head.startsWith("hotfix/"))) {
              core.setFailed("Feature pull requests must target dev. Only dev or hotfix/* may target main.");
              return;
            }

            core.info(`Promotion policy accepted: ${head} -> ${base}`);
